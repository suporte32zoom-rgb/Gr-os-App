<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with rounded squircle for maskable/app icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle Soil Furrows in background -->
  <path d="M 60 410 Q 256 380 452 410" stroke="#81C784" stroke-width="4" stroke-linecap="round" opacity="0.25" fill="none"/>
  <path d="M 40 445 Q 256 415 472 445" stroke="#81C784" stroke-width="5" stroke-linecap="round" opacity="0.25" fill="none"/>

  <!-- Sun / Golden Horizon -->
  <circle cx="256" cy="230" r="115" fill="url(#goldGrad)" opacity="0.9" filter="url(#shadow)"/>

  <!-- Sprouting Plant / Semente & Folhas -->
  <!-- Left Leaf -->
  <path d="M 256 280 C 170 240 140 160 175 110 C 215 95 270 150 256 280 Z" 
        fill="url(#leafGrad)" filter="url(#shadow)"/>
  <path d="M 185 130 Q 220 180 250 245" stroke="#A5D6A7" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Right Leaf (Tilted higher) -->
  <path d="M 256 280 C 330 220 370 140 330 90 C 285 85 245 155 256 280 Z" 
        fill="#388E3C" filter="url(#shadow)"/>
  <path d="M 320 110 Q 290 170 262 245" stroke="#C8E6C9" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Central Stem -->
  <path d="M 256 360 L 256 265" stroke="#2E7D32" stroke-width="14" stroke-linecap="round"/>

  <!-- Golden Grain / Semente at base -->
  <path d="M 256 315 C 220 315 200 355 256 395 C 312 355 292 315 256 315 Z" 
        fill="url(#goldGrad)" filter="url(#shadow)"/>
  <circle cx="256" cy="355" r="7" fill="#E65100"/>

  <!-- Brand Typography Arc or Icon Base -->
  <text x="256" y="470" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="4">HARVESTA</text>
</svg>
